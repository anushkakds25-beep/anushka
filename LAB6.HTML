<!DOCTYPE html>
<html>
<head>
<title>Road Safety Seminar Registration</title>
</head>
<body>
<h2>Road Safety Seminar Registration Form</h2>
<form>
<fieldset>
<legend>Personal Information</legend>

<label>Full Name:</label><br>
<input type="text" name="name" placeholder="Enter your name"><br><br>

<label>Email:</label><br>
<input type="email" name="email" placeholder="Enter your email"><br><br>
<label>Mobile Number:</label><br>
<input type="tel" name="mobile" placeholder="Enter mobile number"><br><br>
</fieldset>
<br>
<fieldset>
<legend>Gender</legend>
<input type="radio" name="gender" value="male"> Male<br>
<input type="radio" name="gender" value="female"> Female<br>
<input type="radio" name="gender" value="other"> Other
</fieldset>
<br>
<fieldset>
<legend>Mode of Participation</legend>
<input type="radio" name="mode" value="online"> Online<br>
<input type="radio" name="mode" value="offline"> Offline
</fieldset>
<br>
<fieldset>
<legend>Topics Interested in Road Safety</legend>
<input type="checkbox" name="topic1"> Traffic Rules Awareness<br>
<input type="checkbox" name="topic2"> Helmet Safety<br>
<input type="checkbox" name="topic3"> Drink and Drive Prevention<br>
<input type="checkbox" name="topic4"> First Aid for Road Accidents
</fieldset>
<br>
<fieldset>
<legend>Select Your City</legend>
<select name="city">
<option value="">--Select City--</option>
<option value="Nagpur">Nagpur</option>
<option value="Mumbai">Mumbai</option>
<option value="Pune">Pune</option>
</select>
</fieldset>
<br>
<input type="submit" value="Register">
<input type="reset" value="Clear">
</form>
</body>
</html>
